# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Build with JDK 25 (MC 26.1.2 requires Java 25 -- Loom enforces this, and the
# Gremlins Modrinth profile bundles a Zulu 25 runtime). Points at the
# brew-installed openjdk@25 so the build does not depend on the machine's
# default Java (openjdk@17).
org.gradle.java.home=/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home

# Fabric toolchain (targets Graham's "Gremlins" Modrinth profile)
minecraft_version=26.1.2
loader_version=0.19.3
fabric_version=0.153.0+26.1.2

# Mod metadata
mod_version=0.1.0
maven_group=com.grahamwilliams.gremlins
archives_base_name=gremlins
