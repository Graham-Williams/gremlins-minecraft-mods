plugins {
    // Minecraft 26.1+ ships UNOBFUSCATED. Fabric no longer publishes mappings for
    // it, so we use the non-remapping Loom plugin `net.fabricmc.fabric-loom`
    // (NOT the legacy `fabric-loom` remapping plugin). There is no `mappings`
    // line and Minecraft/mod dependencies are plain `implementation`, not
    // `modImplementation`, because nothing is remapped. All code references use
    // Mojang's official (deobfuscated) names.
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the essential Minecraft + Fabric repositories automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Server game tests (src/gametest). `runGameTest` boots a headless dedicated
// server on the target Minecraft version, runs every @GameTest and exits non-zero
// on any failure. Loom hooks it into `check`, so `./gradlew build` runs it too.
// The gametest source set is a separate mod (`gremlins-test`) and is never
// packaged into the mod jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "gremlins-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

loom {
    runs {
        gameTest {
            // Independent source of truth for the /gremlins version assertion.
            property "gremlins.expectedVersion", project.version.toString()
            // Per-test results, JUnit XML.
            property "fabric-api.gametest.report-file", layout.buildDirectory.file("gametest/junit.xml").get().asFile.absolutePath
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
